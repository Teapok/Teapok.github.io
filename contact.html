<link href='dist/maplibre-gl.css' rel='stylesheet' />
<div id='map' style='width: 850px; height: 512px;'></div>
<script type='module'>
import * as maplibregl from './dist/maplibre-gl.mjs';

const coords = [37.80355, 48.01507];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [37.80355, 48.01507],
  zoom: 16,
  pitch: 50,
  bearing: 20,
  maxPitch: 85
});

map.setMissingStyleImageResolver(() => ({
  width: 1, height: 1, data: new Uint8Array([0,0,0,0])
}));

map.on('load', () => {
  map.resize();
  // 1. Remove US highway shield layers (irrelevant for Donetsk, kills filter warnings)
  ['highway-shield-non-us', 'highway-shield-us-interstate', 'road_shield_us']
    .forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });  
  // Force Russian labels where available
  for (const layer of map.getStyle().layers) {
    if (layer.type !== 'symbol') continue;
    const tf = layer.layout?.['text-field'];
    if (!tf) continue;

    // Only touch layers that actually use a name field
    const usesName =
      JSON.stringify(tf).includes('name'); // catches {name}, get('name'), etc.
    if (!usesName) continue;

    map.setLayoutProperty(layer.id, 'text-field', [
      'coalesce',
      ['get', 'name:ru'],
      ['get', 'name']
    ]);
  }


const marker = new maplibregl.Marker({ color: '#c00' })
  .setLngLat(coords)
  .setPopup(new maplibregl.Popup().setHTML('<strong>ГУП ДНР «РМХ»</strong><br>Советская площадь, д. 1, Донецк'))
  .addTo(map);

marker.togglePopup();   // opens it immediately
});
</script>
